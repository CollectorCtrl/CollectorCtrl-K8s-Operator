# Source: splunk-otel-collector/templates/configmap-cluster-receiver.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-splunk-otel-collector-otel-k8s-cluster-receiver
  namespace: splunk
  labels:
    app.kubernetes.io/name: splunk-otel-collector
    helm.sh/chart: splunk-otel-collector-0.162.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: splunk
    app.kubernetes.io/version: "0.162.0"
    app: splunk-otel-collector
    chart: splunk-otel-collector-0.162.1
    release: splunk
data:
  relay: |
    exporters:
      signalfx:
        access_token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
        api_url: https://api.us0.observability.splunkcloud.com
        disable_default_translation_rules: true
        ingest_url: https://ingest.us0.observability.splunkcloud.com
        timeout: 10s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13134
      opamp/splunk_o11y:
        agent_description:
          include_resource_attributes: true
        server:
          http:
            endpoint: http://splunk-splunk-otel-collector:4320/v1/opamp
            headers:
              X-SF-Token: ${SPLUNK_OBSERVABILITY_ACCESS_TOKEN}
            polling_interval: 30s
    processors:
      batch:
        send_batch_max_size: 32768
      memory_limiter:
        check_interval: 2s
        limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
      resource:
        attributes:
        - action: insert
          key: metric_source
          value: kubernetes
        - action: upsert
          key: k8s.cluster.name
          value: prod
      resource/add_cluster_host:
        attributes:
        - action: insert
          key: host.name
          value: ${K8S_NODE_NAME}
      resource/k8s_cluster:
        attributes:
        - action: insert
          key: receiver
          value: k8scluster
      resource_detection:
        detectors:
        - env
        - system
        override: true
        timeout: 15s
      transform/k8shpascaletargetref:
        error_mode: ignore
        metric_statements:
        - context: resource
          statements:
          - set(resource.attributes["k8s.replicaset.name"], resource.attributes["k8s.hpa.scaletargetref.name"])
            where IsMatch(resource.attributes["k8s.hpa.scaletargetref.kind"], "ReplicaSet")
          - set(resource.attributes["k8s.statefulset.name"], resource.attributes["k8s.hpa.scaletargetref.name"])
            where IsMatch(resource.attributes["k8s.hpa.scaletargetref.kind"], "StatefulSet")
          - set(resource.attributes["k8s.deployment.name"], resource.attributes["k8s.hpa.scaletargetref.name"])
            where IsMatch(resource.attributes["k8s.hpa.scaletargetref.kind"], "Deployment")
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        metadata_exporters:
        - signalfx
        metrics:
          k8s.container.status.reason:
            enabled: true
          k8s.node.condition:
            enabled: true
          k8s.pod.status_reason:
            enabled: true
        resource_attributes:
          k8s.hpa.scaletargetref.kind:
            enabled: true
          k8s.hpa.scaletargetref.name:
            enabled: true
          k8s.kubelet.version:
            enabled: true
          k8s.pod.qos_class:
            enabled: true
      prometheus/k8s_cluster_receiver:
        config:
          scrape_configs:
          - job_name: otel-k8s-cluster-receiver
            metric_relabel_configs:
            - action: drop
              regex: promhttp_metric_handler_errors.*
              source_labels:
              - __name__
            - action: drop
              regex: otelcol_processor_batch_.*
              source_labels:
              - __name__
            - action: drop
              regex: .*otelcol\.k8s\.pod\.association
              source_labels:
              - __name__
            scrape_interval: 10s
            static_configs:
            - targets:
              - localhost:8899
    service:
      extensions:
      - health_check
      - opamp/splunk_o11y
      pipelines:
        metrics:
          exporters:
          - signalfx
          processors:
          - memory_limiter
          - batch
          - transform/k8shpascaletargetref
          - resource
          - resource/k8s_cluster
          receivers:
          - k8s_cluster
        metrics/collector:
          exporters:
          - signalfx
          processors:
          - memory_limiter
          - batch
          - resource_detection
          receivers:
          - prometheus/k8s_cluster_receiver
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: localhost
                  port: 8899
                  without_scope_info: true
                  without_type_suffix: true
                  without_units: true
        resource:
          attributes:
          - name: service.name
            value: otel-k8s-cluster-receiver
          - name: otelcol.service.mode
            value: clusterReceiver
          - name: k8s.node.name
            value: ${K8S_NODE_NAME}
          - name: k8s.pod.name
            value: ${K8S_POD_NAME}
          - name: k8s.pod.uid
            value: ${K8S_POD_UID}
          - name: k8s.namespace.name
            value: ${K8S_NAMESPACE}
          - name: metric_source
            value: kubernetes
          - name: k8s.cluster.name
            value: prod
