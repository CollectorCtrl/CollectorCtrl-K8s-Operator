---
# Source: adot-exporter-for-eks-on-ec2/templates/adot-collector/namespace.yaml
# Specify namespace for ADOT Collector as a DaemonSet.
apiVersion: v1
kind: Namespace
metadata:
  name: amazon-metrics
  labels:
    name: amazon-metrics    
    helm.sh/chart: adot-exporter-for-eks-on-ec2-0.22.0
    app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/instance: adot
    app.kubernetes.io/version: "0.37.0"
    app.kubernetes.io/component: opentelemetry
    app.kubernetes.io/part-of: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/managed-by: Helm
---
# Source: adot-exporter-for-eks-on-ec2/templates/adot-collector/serviceaccount.yaml
# Service account provides identity information for a user to be able to authenticate processes running in a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector-sa
  namespace: amazon-metrics
---
# Source: adot-exporter-for-eks-on-ec2/templates/adot-collector/configmap.yaml
# ConfigMap for ADOT Collector as a DaemonSet with the specified configurations, including configured values from values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adot-conf
  namespace: amazon-metrics
  labels:
    app: opentelemetry
    component: adot-conf    
    helm.sh/chart: adot-exporter-for-eks-on-ec2-0.22.0
    app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/instance: adot
    app.kubernetes.io/version: "0.37.0"
    app.kubernetes.io/component: opentelemetry
    app.kubernetes.io/part-of: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/managed-by: Helm
data:
  adot-config:  |
    extensions:
      health_check: 
      sigv4auth:
        region: eu-west-1
    receivers:
      awscontainerinsightreceiver:
        collection_interval: 
        container_orchestrator: 
        add_service_as_attribute: 
        prefer_full_pod_name: 
        add_full_pod_name_metric_label: 
      prometheus:
        config:
          global:
            scrape_interval: 15s
            scrape_timeout: 10s
          scrape_configs: 
            
            - job_name: 'k8s_metrics_scrape'
              sample_limit: 10000
              metrics_path: /metrics
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  regex: (.+)
                  target_label: __metrics_path__
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: K8S_NAMESPACE
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: K8S_POD_NAME
                - source_labels: [__meta_kubernetes_pod_container_name]
                  action: replace
                  target_label: EKS_Container
            
    processors:
      batch/metrics:
        timeout: 60s
    exporters:
      awsemf:
        namespace: ContainerInsights
        log_group_name: '/aws/containerinsights/prod/performance'
        log_stream_name: InputNodeName
        region: eu-west-1
        resource_to_telemetry_conversion:
          enabled: true
        dimension_rollup_option: NoDimensionRollup
        parse_json_encoded_attr_values:
        - Sources
        - kubernetes
        metric_declarations:
          
          # node metrics
          - dimensions: [[NodeName, InstanceId, ClusterName]]
            metric_name_selectors:
              - node_cpu_utilization
              - node_memory_utilization
              - node_network_total_bytes
              - node_cpu_reserved_capacity
              - node_memory_reserved_capacity
              - node_number_of_running_pods
              - node_number_of_running_containers
          - dimensions: [[ClusterName]]
            metric_name_selectors:
              - node_cpu_utilization
              - node_memory_utilization
              - node_network_total_bytes
              - node_cpu_reserved_capacity
              - node_memory_reserved_capacity
              - node_number_of_running_pods
              - node_number_of_running_containers
              - node_cpu_usage_total
              - node_cpu_limit
              - node_memory_working_set
              - node_memory_limit
          # pod metrics
          - dimensions: [[PodName, Namespace, ClusterName], [Service, Namespace, ClusterName], [Namespace, ClusterName], [ClusterName]]
            metric_name_selectors:
              - pod_cpu_utilization
              - pod_memory_utilization
              - pod_network_rx_bytes
              - pod_network_tx_bytes
              - pod_cpu_utilization_over_pod_limit
              - pod_memory_utilization_over_pod_limit
          - dimensions: [[PodName, Namespace, ClusterName], [ClusterName]]
            metric_name_selectors:
              - pod_cpu_reserved_capacity
              - pod_memory_reserved_capacity
          - dimensions: [[PodName, Namespace, ClusterName]]
            metric_name_selectors:
              - pod_number_of_container_restarts
          # cluster metrics
          - dimensions: [[ClusterName]]
            metric_name_selectors:
              - cluster_node_count
              - cluster_failed_node_count
          # service metrics
          - dimensions: [[Service, Namespace, ClusterName], [ClusterName]]
            metric_name_selectors:
              - service_number_of_running_pods
          # node fs metrics
          - dimensions: [[NodeName, InstanceId, ClusterName], [ClusterName]]
            metric_name_selectors:
              - node_filesystem_utilization
          # namespace metrics
          - dimensions: [[Namespace, ClusterName], [ClusterName]]
            metric_name_selectors:
              - namespace_number_of_running_pods
          
      prometheusremotewrite:
        namespace: 
        endpoint: 
        resource_to_telemetry_conversion: 
          enabled: false
        auth:
          authenticator: sigv4auth
        
    service:
      pipelines:
        metrics:
          receivers:
          - prometheus
          processors:
          - batch/metrics
          exporters:
          - prometheusremotewrite
      extensions:
      - health_check
      - sigv4auth
---
# Source: adot-exporter-for-eks-on-ec2/templates/adot-collector/clusterrole.yaml
# ClusterRole for ADOT Collector as a DaemonSet contains rules, and defines and grants permissions to specified resources/endpoints.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: adot-collector-role
  labels:    
    helm.sh/chart: adot-exporter-for-eks-on-ec2-0.22.0
    app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/instance: adot
    app.kubernetes.io/version: "0.37.0"
    app.kubernetes.io/component: opentelemetry
    app.kubernetes.io/part-of: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "endpoints"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/stats", "configmaps", "events"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["adot-container-insight-clusterleader", "otel-container-insight-clusterleader"]
    verbs: ["get","update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["otel-container-insight-clusterleader"]
    verbs: ["get", "update", "create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create"]
---
# Source: adot-exporter-for-eks-on-ec2/templates/adot-collector/clusterrolebinding.yaml
# ClusterRoleBinding for ADOT Collector as a DaemonSet references and grants permissions defined in ClusterRole to service accounts/users/groups in subjects.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: adot-collector-role-binding
  labels:    
    helm.sh/chart: adot-exporter-for-eks-on-ec2-0.22.0
    app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/instance: adot
    app.kubernetes.io/version: "0.37.0"
    app.kubernetes.io/component: opentelemetry
    app.kubernetes.io/part-of: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/managed-by: Helm
subjects:
- kind: ServiceAccount
  name: adot-collector-sa
  namespace: amazon-metrics
roleRef:
  kind: ClusterRole
  name: adot-collector-role
  apiGroup: rbac.authorization.k8s.io
---
# Source: adot-exporter-for-eks-on-ec2/templates/adot-collector/daemonset.yaml
# ADOT Collector as a DaemonSet for deployment.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: adot-collector-daemonset
  namespace: amazon-metrics
  labels:    
    helm.sh/chart: adot-exporter-for-eks-on-ec2-0.22.0
    app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/instance: adot
    app.kubernetes.io/version: "0.37.0"
    app.kubernetes.io/component: opentelemetry
    app.kubernetes.io/part-of: adot-exporter-for-eks-on-ec2
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      name: adot-collector-daemonset      
      app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
      app.kubernetes.io/instance: adot
  template:
    metadata:
      labels:
        name: adot-collector-daemonset        
        helm.sh/chart: adot-exporter-for-eks-on-ec2-0.22.0
        app.kubernetes.io/name: adot-exporter-for-eks-on-ec2
        app.kubernetes.io/instance: adot
        app.kubernetes.io/version: "0.37.0"
        app.kubernetes.io/component: opentelemetry
        app.kubernetes.io/part-of: adot-exporter-for-eks-on-ec2
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: 2b201a4686a84058782eca958504684bd7a73c780b05df690843be9d895bdbc1
    spec:
      containers:
        - name: adot-collector-container
          image: "amazon/aws-otel-collector:v0.37.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /awscollector
            - --config=/conf/adot-config.yaml
          volumeMounts:
            - mountPath: /rootfs
              name: rootfs
              readOnly: true
            - mountPath: /var/run/docker.sock
              name: dockersock
              readOnly: true
            - mountPath: /var/lib/docker
              name: varlibdocker
              readOnly: true
            - mountPath: /run/containerd/containerd.sock
              name: containerdsock
              readOnly: true
            - mountPath: /sys
              name: sys
              readOnly: true
            - mountPath: /dev/disk
              name: devdisk
              readOnly: true
            - mountPath: /conf
              name: adot-config-vol
          resources:
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 200m
              memory: 200Mi
      volumes:
          - configMap:
              items:
              - key: adot-config
                path: adot-config.yaml
              name: adot-conf
            name: adot-config-vol
          - hostPath:
              path: /
            name: rootfs
          - hostPath:
              path: /var/run/docker.sock
            name: dockersock
          - hostPath:
              path: /var/lib/docker
            name: varlibdocker
          - hostPath:
              path: /run/containerd/containerd.sock
            name: containerdsock
          - hostPath:
              path: /sys
            name: sys
          - hostPath:
              path: /dev/disk/
            name: devdisk
      serviceAccountName: adot-collector-sa
      tolerations:
        []
