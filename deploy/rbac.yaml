# Cluster-wide, read-only observation RBAC for the CollectorCtrl observer.
# The enrollment token reaches the pod as an environment variable from a Secret,
# so the observer needs no API access to Secrets. Grant secrets/get for named
# Secrets only if a CollectorMonitor uses spec.auth.secretRef.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collectorctrl-operator
  namespace: collectorctrl
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collectorctrl-operator
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors/status"]
    verbs: ["get", "update", "patch"]
  # Stable cluster ID is derived from the kube-system namespace UID.
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collectorctrl-operator
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collectorctrl-operator
subjects:
  - kind: ServiceAccount
    name: collectorctrl-operator
    namespace: collectorctrl
