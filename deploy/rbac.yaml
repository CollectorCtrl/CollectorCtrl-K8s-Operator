apiVersion: v1
kind: ServiceAccount
metadata:
  name: collectorctrl-operator
  namespace: collectorctrl
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collectorctrl-operator
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["collectorctrl-auth"]
    verbs: ["get"]
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collectorctrl-operator
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collectorctrl-operator
subjects:
  - kind: ServiceAccount
    name: collectorctrl-operator
    namespace: collectorctrl
