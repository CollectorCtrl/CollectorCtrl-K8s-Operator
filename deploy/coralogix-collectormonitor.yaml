# CollectorMonitors for a Coralogix OpenTelemetry integration (Helm chart
# otel-coralogix-integration):
# 1. coralogix-agent: the node-level agent DaemonSet
# 2. coralogix-collector: the cluster collector/gateway Deployment
#
# Verify labels and ConfigMaps in your cluster first:
#   kubectl get daemonset,deployment -n observability --show-labels
#   kubectl get configmap -n observability
# spec.opampServer must exactly match the observer's OPAMP_SERVER.

---
apiVersion: collectorctrl.io/v1alpha1
kind: CollectorMonitor
metadata:
  name: coralogix-agent
  namespace: observability
  labels:
    k8s.cluster.name: "my-eks-cluster"
    app.kubernetes.io/part-of: collectorctrl
spec:
  workloadSelector:
    kind: DaemonSet
    matchLabels:
      app.kubernetes.io/instance: otel-coralogix-integration
      app.kubernetes.io/name: opentelemetry-agent
      component: agent-collector
  configMapSelector:
    name: coralogix-opentelemetry-agent
    key: relay.yaml
  opampServer: "wss://collectorctrl.example.internal:4320/v1/opamp"
  reportConfig: false
  healthCheck:
    interval: 30s

---
apiVersion: collectorctrl.io/v1alpha1
kind: CollectorMonitor
metadata:
  name: coralogix-collector
  namespace: observability
  labels:
    k8s.cluster.name: "my-eks-cluster"
    app.kubernetes.io/part-of: collectorctrl
spec:
  workloadSelector:
    kind: Deployment
    matchLabels:
      app.kubernetes.io/name: coralogix-opentelemetry-collector
      app.kubernetes.io/component: otel-collector
  configMapSelector:
    name: coralogix-opentelemetry-collector
    key: relay.yaml
  opampServer: "wss://collectorctrl.example.internal:4320/v1/opamp"
  reportConfig: false
  healthCheck:
    interval: 30s
