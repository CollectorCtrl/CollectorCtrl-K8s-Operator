# CollectorCtrl Kubernetes observer (raw manifest).
# The Helm chart in helm-charts/collectorctrl-operator is the supported install
# path; this manifest mirrors its defaults for clusters without Helm.
# Before applying, replace OPAMP_SERVER (or use deploy/deploy.sh, which does it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collectorctrl-operator
  namespace: collectorctrl
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/instance: collectorctrl-operator
    app.kubernetes.io/version: "0.6.0-beta"
    app.kubernetes.io/managed-by: kubectl
spec:
  # Exactly one replica: credential storage supports a single writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collectorctrl-operator
      app.kubernetes.io/instance: collectorctrl-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collectorctrl-operator
        app.kubernetes.io/instance: collectorctrl-operator
    spec:
      serviceAccountName: collectorctrl-operator
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          image: "ghcr.io/collectorctrl/collectorctrl-k8s-operator/operator:latest"
          imagePullPolicy: Always
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: OPAMP_SERVER
              # Must be wss:// with a certificate the observer trusts. Every
              # CollectorMonitor must use exactly this endpoint.
              value: "wss://collectorctrl.example.internal:4320/v1/opamp"
            - name: OPAMP_AUTH_MODE
              value: "enroll"
            - name: OPAMP_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: collectorctrl-auth
                  key: enrollment-token
            - name: OPAMP_CREDENTIAL_DIRECTORY
              value: /var/lib/collectorctrl/credentials
            - name: CLUSTER_ID
              # Empty: derived from the kube-system namespace UID.
              value: ""
            # Private CA: create ConfigMap collectorctrl-opamp-ca (key ca.crt),
            # then uncomment this env var and the opamp-ca mount and volume.
            # - name: OPAMP_CA_FILE
            #   value: /etc/collectorctrl/ca/ca.crt
          volumeMounts:
            - name: credentials
              mountPath: /var/lib/collectorctrl
            # - name: opamp-ca
            #   mountPath: /etc/collectorctrl/ca
            #   readOnly: true
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: credentials
          persistentVolumeClaim:
            claimName: collectorctrl-operator-credentials
        # - name: opamp-ca
        #   configMap:
        #     name: collectorctrl-opamp-ca
