# Example CollectorMonitor: observe an existing Splunk OpenTelemetry Collector DaemonSet.
# Adjust namespace, workload, container and ConfigMap to match your deployment.
#
# Authentication comes from the observer's own enrollment token
# (Secret collectorctrl-auth in the collectorctrl namespace), so no per-monitor
# Secret is needed. spec.opampServer must exactly match the observer's OPAMP_SERVER.

apiVersion: collectorctrl.io/v1alpha1
kind: CollectorMonitor
metadata:
  name: splunk-otel-collector
  namespace: observability
  labels:
    k8s.cluster.name: "dev-cluster"
    app.kubernetes.io/part-of: collectorctrl
spec:
  # Must select exactly one Deployment, DaemonSet or StatefulSet.
  workloadSelector:
    kind: DaemonSet
    matchLabels:
      app.kubernetes.io/name: splunk-otel-collector
      app.kubernetes.io/component: otel-collector

  # Required when the pod has more than one container.
  collectorContainer: otel-collector

  # Only needed when several ConfigMaps or keys are mounted.
  configMapSelector:
    name: splunk-otel-collector-otel-agent
    key: relay.yaml

  opampServer: "wss://collectorctrl.example.internal:4320/v1/opamp"

  # Upload the collector YAML to CollectorCtrl. Off by default; leave it off
  # if the config contains inline credentials.
  reportConfig: false

  healthCheck:
    interval: 30s
