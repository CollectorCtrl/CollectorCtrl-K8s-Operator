# Durable per-workload credentials issued at enrollment. Keep this claim across
# upgrades and reinstalls; deleting it forces every workload to re-enroll.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: collectorctrl-operator-credentials
  namespace: collectorctrl
  labels:
    app.kubernetes.io/name: collectorctrl-operator
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: gp3   # uncomment to pick a storage class
  resources:
    requests:
      storage: 128Mi
