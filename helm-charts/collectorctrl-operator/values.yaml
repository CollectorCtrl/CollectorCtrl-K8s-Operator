replicaCount: 1

image:
  # Published by .github/workflows/build-operator.yml as ghcr.io/<owner>/<repo>/operator.
  repository: ghcr.io/collectorctrl/collectorctrl-k8s-operator/operator
  # Empty uses the chart's appVersion (an immutable release tag such as 0.7.0).
  # "main"/"latest" track the main branch; use them only for testing, with
  # pullPolicy: Always.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# OpAMP Server connection settings
opamp:
  server: "wss://collectorctrl.corp.internal:4320/v1/opamp"
  # enroll is the secure default; legacy requires explicit server legacy mode.
  authMode: enroll
  # Existing Secret with enrollment-token (cce_...). Each new workload consumes
  # one enrollment use; existing workloads reconnect with persisted credentials.
  enrollmentSecret: ""
  # Legacy migration only: existing Secret with secret-key.
  existingSecret: ""
  # If existingSecret is not set, provide the secret key directly (not recommended for production)
  secretKey: ""

# Required durable credentials; retain this volume across upgrades/reinstalls.
# One active replica is supported; Recreate avoids simultaneous writers.
credentialStorage:
  existingClaim: ""
  size: 128Mi
  storageClassName: null

# RBAC scope: true = observe collectors across namespaces
# false = namespace-scoped only
rbac:
  clusterScoped: true
  # API get access for per-monitor auth.secretRef; empty grants no Secret reads.
  authSecretNames: []

# Stable unique identity; empty discovers the kube-system namespace UID.
# Required when rbac.clusterScoped=false.
clusterID: ""

# Human-readable cluster name shown in CollectorCtrl (defaults to clusterID).
clusterName: ""

# One extra connection per cluster that lists collector-like workloads (by
# image name only, no configuration) so the UI can suggest which to opt in.
clusterObserver:
  enabled: true

# Instrumentation readiness (needs clusterObserver.enabled). Every application
# workload gets a verdict: which language it runs, which APM agents (any
# vendor) are loaded or requested, which injector webhooks select it, and
# which launcher variables (JAVA_TOOL_OPTIONS, NODE_OPTIONS, ...) an injector
# would have to merge with. Read-only and metadata-only: launcher values are
# reduced to agent paths and module names, Secrets are never read and image
# registries are never contacted (variables baked into images are not seen).
readiness:
  enabled: true
  # How often the report is sent (1m to 1h).
  interval: 5m
  # Namespaces never scanned. The operator's own namespace is always skipped.
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease

# Optional trusted CA bundle supplied as an existing ConfigMap (key ca.crt).
opampCAConfigMap: ""

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsUser: 65532
  runAsGroup: 65532

# Health probes
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Prometheus Operator ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Leader election is not needed: the observer runs exactly one replica because
# credential storage supports a single writer (replicaCount must stay 1).
# Leave disabled; enabling it only adds a Lease lock and its RBAC.
leaderElection:
  enabled: false
