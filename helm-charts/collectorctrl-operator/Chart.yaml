apiVersion: v2
name: collectorctrl-operator
description: Observes OpenTelemetry Collector workloads (any vendor chart) and application instrumentation readiness, and reports them to CollectorCtrl over OpAMP
type: application
version: 0.4.0
appVersion: "0.8.0"
home: https://collectorctrl.com
sources:
  - https://github.com/CollectorCtrl/CollectorCtrl-K8s-Operator
maintainers:
  - name: CollectorCtrl Team
    email: engineering@collectorctrl.com
keywords:
  - opentelemetry
  - collector
  - opamp
  - observability
  - fleet-management
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: Instrumentation readiness report (languages, APM agents of any vendor, injector webhooks, launcher variables)
    - kind: added
      description: readiness.enabled, readiness.interval and readiness.excludeNamespaces values
    - kind: changed
      description: RBAC adds list on namespaces and mutatingwebhookconfigurations while readiness is enabled
