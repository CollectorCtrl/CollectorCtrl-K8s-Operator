apiVersion: v2
name: collectorctrl-operator
description: Observes OpenTelemetry Collector workloads (any vendor chart) and reports health, role and topology to CollectorCtrl over OpAMP
type: application
version: 0.3.0
appVersion: "0.7.0"
home: https://collectorctrl.com
sources:
  - https://github.com/CollectorCtrl/CollectorCtrl-K8s-Operator
maintainers:
  - name: CollectorCtrl Team
    email: engineering@collectorctrl.com
keywords:
  - opentelemetry
  - collector
  - opamp
  - observability
  - fleet-management
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: Label opt-in discovery (collectorctrl.io/observe), role, stack and topology inference
    - kind: added
      description: Cluster connection listing collector workloads not yet opted in
    - kind: changed
      description: Default namespace collectorctrl-operator; RBAC adds read access to Services
