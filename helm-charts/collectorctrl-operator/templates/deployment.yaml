{{- if and (not .Values.rbac.clusterScoped) (not .Values.clusterID) }}
{{- fail "clusterID is required for namespace-scoped observation" }}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "credential persistence currently requires replicaCount=1" }}
{{- end }}
{{- if not (has .Values.opamp.authMode (list "enroll" "legacy")) }}
{{- fail "opamp.authMode must be enroll or legacy" }}
{{- end }}
{{- if and (eq .Values.opamp.authMode "enroll") (not .Values.opamp.enrollmentSecret) (not .Values.credentialStorage.existingClaim) }}
{{- fail "opamp.enrollmentSecret is required to enroll new workloads (or supply an existing credential claim)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collectorctrl-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collectorctrl-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "collectorctrl-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collectorctrl-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "collectorctrl-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          env:
            - name: OPAMP_AUTH_MODE
              value: {{ .Values.opamp.authMode | quote }}
            - name: OPAMP_CREDENTIAL_DIRECTORY
              value: /var/lib/collectorctrl/credentials
            - name: CLUSTER_ID
              value: {{ .Values.clusterID | quote }}
            {{- if not .Values.rbac.clusterScoped }}
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- if .Values.opampCAConfigMap }}
            - name: OPAMP_CA_FILE
              value: /etc/collectorctrl/ca/ca.crt
            {{- end }}
            - name: OPAMP_SERVER
              value: {{ .Values.opamp.server | quote }}
            {{- if and (eq .Values.opamp.authMode "enroll") .Values.opamp.enrollmentSecret }}
            - name: OPAMP_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opamp.enrollmentSecret }}
                  key: enrollment-token
            {{- end }}
            {{- if and (eq .Values.opamp.authMode "legacy") .Values.opamp.existingSecret }}
            - name: OPAMP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opamp.existingSecret }}
                  key: secret-key
            {{- else if and (eq .Values.opamp.authMode "legacy") .Values.opamp.secretKey }}
            - name: OPAMP_SECRET_KEY
              value: {{ .Values.opamp.secretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: credentials
              mountPath: /var/lib/collectorctrl
          {{- if .Values.opampCAConfigMap }}
            - name: opamp-ca
              mountPath: /etc/collectorctrl/ca
              readOnly: true
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: credentials
          persistentVolumeClaim:
            claimName: {{ .Values.credentialStorage.existingClaim | default (printf "%s-credentials" (include "collectorctrl-operator.fullname" .)) }}
      {{- if .Values.opampCAConfigMap }}
        - name: opamp-ca
          configMap:
            name: {{ .Values.opampCAConfigMap }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
