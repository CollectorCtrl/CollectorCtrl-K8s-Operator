{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "collectorctrl-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collectorctrl-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.clusterScoped }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "collectorctrl-operator.fullname" . }}
  labels:
    {{- include "collectorctrl-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
{{- if .Values.rbac.authSecretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml .Values.rbac.authSecretNames | nindent 6 }}
    verbs: ["get"]
{{- end }}
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
{{- if .Values.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "collectorctrl-operator.fullname" . }}
  labels:
    {{- include "collectorctrl-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "collectorctrl-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "collectorctrl-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "collectorctrl-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collectorctrl-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["get", "list", "watch"]
{{- if .Values.rbac.authSecretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml .Values.rbac.authSecretNames | nindent 6 }}
    verbs: ["get"]
{{- end }}
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["collectorctrl.io"]
    resources: ["collectormonitors/status"]
    verbs: ["get", "update", "patch"]
{{- if .Values.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "collectorctrl-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collectorctrl-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "collectorctrl-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "collectorctrl-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
