name: Release

# Pushing a tag vX.Y.Z publishes the release. The CI workflow builds, signs and
# pushes the image for the same tag; this workflow publishes the Helm chart
# (OCI, signed), the raw manifests and the GitHub Release with notes taken from
# CHANGELOG.md. It refuses to run if the tag, chart and changelog disagree.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the chart to GHCR
      id-token: write # keyless cosign signing
    env:
      CHART_DIR: helm-charts/collectorctrl-operator
      CHART_REPO: oci://ghcr.io/collectorctrl/charts
      IMAGE: ghcr.io/collectorctrl/collectorctrl-k8s-operator/operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Check the tag matches the chart and the changelog
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="$(awk -F'"' '/^appVersion:/ {print $2}' "$CHART_DIR/Chart.yaml")"
          chart="$(awk '/^version:/ {print $2}' "$CHART_DIR/Chart.yaml")"
          [ "$app" = "$version" ] || { echo "::error::Chart appVersion is $app, tag is $version"; exit 1; }
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md needs a dated section: ## [$version] - YYYY-MM-DD"; exit 1; }
          grep -q "operator:$version\"" deploy/deployment.yaml \
            || { echo "::error::deploy/deployment.yaml does not use image tag $version"; exit 1; }
          prerelease=false; case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "chart=$chart"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Package the chart and bundle the manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART_VERSION: ${{ steps.version.outputs.chart }}
        run: |
          mkdir -p dist
          helm lint "$CHART_DIR" --set opamp.enrollmentSecret=collectorctrl-auth
          helm package "$CHART_DIR" --destination dist
          # Raw manifests in apply order, for clusters without Helm.
          for f in namespace crd rbac credentials-pvc deployment; do
            cat "deploy/$f.yaml"; echo "---"
          done > "dist/collectorctrl-operator-$VERSION-manifests.yaml"
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push and sign the chart (OCI)
        id: chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          out="$(helm push "dist/collectorctrl-operator-$CHART_VERSION.tgz" "$CHART_REPO" 2>&1)"
          echo "$out"
          digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          [ -n "$digest" ] || { echo "::error::no chart digest"; exit 1; }
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/collectorctrl/charts/collectorctrl-operator@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART_VERSION: ${{ steps.version.outputs.chart }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`sh
          helm install collectorctrl-operator $CHART_REPO/collectorctrl-operator --version $CHART_VERSION \\
            --namespace collectorctrl-operator --create-namespace \\
            --set opamp.server=wss://<your-server>:4320/v1/opamp --set opamp.enrollmentSecret=collectorctrl-auth
          \`\`\`

          Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64), signed with Sigstore cosign, with SBOM and SLSA
          provenance attestations. Verify it as described in [docs/verifying.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/verifying.md).
          EOF

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
