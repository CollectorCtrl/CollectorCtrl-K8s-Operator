# Categories for GitHub's generated release notes (used alongside CHANGELOG.md).
changelog:
  exclude:
    authors: [dependabot]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
