version: "2"
run:
  timeout: 5m
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    misspell:
      locale: UK # project docs and messages use British spelling
      ignore-rules:
        - analyze # exported Go API name (readiness.Analyze)
    gosec:
      excludes:
        - G304 # file paths come from administrator configuration (credential dir, CA file)
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
